<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Address Book</title>
    <link rel="stylesheet" href="/src/style.css">
    <script type="module" src="/src/main.ts"></script>
</head>
<body>
<main>
    <header>
        <h1>Address Book</h1>
        <p>A TypedRest client running in the browser. <a href="/scalar">API reference</a></p>
    </header>

    <form id="add-contact">
        <input name="firstName" placeholder="First name" aria-label="First name" required>
        <input name="lastName" placeholder="Last name" aria-label="Last name" required>
        <button type="submit">Add contact</button>
    </form>

    <ul id="contacts"></ul>

    <output id="status" role="status"></output>
</main>
</body>
</html>
